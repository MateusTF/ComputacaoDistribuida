// Serviço de streaming de músicas — contrato gRPC (Protocol Buffers v3).
// Compartilhado pelas versões Python (código gerado pelo protoc) e Node.js (carregado em tempo de execução).
//
// Gerar o código Python (na pasta python/):
//   python -m grpc_tools.protoc -I ../contratos --python_out=grpc_svc --pyi_out=grpc_svc --grpc_python_out=grpc_svc ../contratos/streaming.proto
syntax = "proto3";

package streaming;

message Usuario  { int32 id = 1; string nome = 2; int32 idade = 3; }
message Musica   { int32 id = 1; string nome = 2; int32 duracao_seg = 3; int32 album_id = 4; int32 genero_id = 5; }
message Playlist { int32 id = 1; string nome = 2; int32 usuario_id = 3; repeated int32 musicas = 4; }
message Genero   { int32 id = 1; string nome = 2; }
message Artista  { int32 id = 1; string nome = 2; string pais = 3; }
message Album    { int32 id = 1; string titulo = 2; int32 ano = 3; int32 artista_id = 4; }

message Id      { int32 id = 1; }
message Vazio   {}
message Pagina  { int32 pagina = 1; int32 tamanho = 2; }   // 0 = valor padrão (página 1, 100 itens)

message Usuarios  { repeated Usuario usuarios = 1; }
message Musicas   { repeated Musica musicas = 1; }
message Playlists { repeated Playlist playlists = 1; }
message Generos   { repeated Genero generos = 1; }
message Artistas  { repeated Artista artistas = 1; }
message Albuns    { repeated Album albuns = 1; }

message NovoUsuario  { string nome = 1; int32 idade = 2; }
message NovaMusica   { string nome = 1; int32 duracao_seg = 2; int32 album_id = 3; int32 genero_id = 4; }
message NovaPlaylist { string nome = 1; int32 usuario_id = 2; repeated int32 musicas = 3; }

// "optional" permite saber se o campo foi enviado (atualização parcial)
message AtualizaUsuario  { int32 id = 1; optional string nome = 2; optional int32 idade = 3; }
message AtualizaMusica   { int32 id = 1; optional string nome = 2; optional int32 duracao_seg = 3;
                           optional int32 album_id = 4; optional int32 genero_id = 5; }
message AtualizaPlaylist { int32 id = 1; optional string nome = 2; repeated int32 musicas = 3; bool trocar_musicas = 4; }

service Streaming {
  // Usuários
  rpc ListarUsuarios (Pagina) returns (Usuarios);
  rpc ObterUsuario (Id) returns (Usuario);
  rpc CriarUsuario (NovoUsuario) returns (Usuario);
  rpc AtualizarUsuario (AtualizaUsuario) returns (Usuario);
  rpc RemoverUsuario (Id) returns (Vazio);

  // Músicas
  rpc ListarMusicas (Pagina) returns (Musicas);
  rpc ObterMusica (Id) returns (Musica);
  rpc CriarMusica (NovaMusica) returns (Musica);
  rpc AtualizarMusica (AtualizaMusica) returns (Musica);
  rpc RemoverMusica (Id) returns (Vazio);

  // Playlists
  rpc ListarPlaylists (Pagina) returns (Playlists);
  rpc ObterPlaylist (Id) returns (Playlist);
  rpc CriarPlaylist (NovaPlaylist) returns (Playlist);
  rpc AtualizarPlaylist (AtualizaPlaylist) returns (Playlist);
  rpc RemoverPlaylist (Id) returns (Vazio);

  // Consultas do enunciado
  rpc PlaylistsDoUsuario (Id) returns (Playlists);
  rpc MusicasDaPlaylist (Id) returns (Musicas);
  rpc PlaylistsComMusica (Id) returns (Playlists);

  // Entidades extras (leitura)
  rpc ListarGeneros (Vazio) returns (Generos);
  rpc ObterGenero (Id) returns (Genero);
  rpc ListarArtistas (Pagina) returns (Artistas);
  rpc ObterArtista (Id) returns (Artista);
  rpc AlbunsDoArtista (Id) returns (Albuns);
  rpc ObterAlbum (Id) returns (Album);
  rpc MusicasDoAlbum (Id) returns (Musicas);

  // Exclusivo do gRPC: envia as músicas uma a uma (server streaming)
  rpc TransmitirMusicasDaPlaylist (Id) returns (stream Musica);
}
